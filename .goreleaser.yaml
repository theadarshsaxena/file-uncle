version: 2
project_name: file-uncle
dist: dist

# Before building, clean up and test
before:
  hooks:
    - go mod tidy
    - go test ./...

# Build for different platforms
builds:
  - main: ./cmd/file-uncle/main.go
    binary: file-uncle
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
  
  # extra_files:
  #   - glob: ./README.md
  #   - glob: ./LICENSE
  #   - glob: ./docs/installation.md
  #     name_template: "INSTALL.md"

# Package the results
# archives:
#   - format: tar.gz
#     format_overrides:
#       - goos: windows
#         format: zip
#     files:
#       - README.md
#       - LICENSE

# Create checksums
checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - "merge conflict"
      - Merge pull request
      - Merge remote-tracking branch
      - Merge branch
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: 'Bug fixes'
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: 'Performance improvements'
      regexp: '^.*?perf(\(.+\))??!?:.+$'
      order: 2
    - title: Others
      order: 999


release:
  github:
    owner: theadarshsaxena
    name: file-uncle
  prerelease: auto
  make_latest: true
  name_template: "{{.ProjectName}} v{{.Version}}"
  
  header: |
    ## 🎉 {{.ProjectName}} {{.Version}} Released!
    
    **Full Changelog**: https://github.com/theadarshsaxena/file-uncle/compare/{{.PreviousTag}}...{{.Tag}}
    
  footer: |
    ## Installation
    
    ### Download Binary
    Download the appropriate binary for your system from the assets below.
